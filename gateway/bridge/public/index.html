<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XyDesk — RDP Darurat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #0b0b12; color: #ececf4; }
  .wrap { max-width: 460px; margin: 8vh auto; padding: 0 20px; }
  h1 { font-size: 21px; } h1 .grad { background: linear-gradient(90deg,#a78bfa,#7c3aed); -webkit-background-clip: text; color: transparent; }
  .card { background: #16161f; border: 1px solid #26263a; border-radius: 14px; padding: 18px; }
  label { display: block; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #9a9ab4; margin: 12px 0 6px; }
  input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #2c2c42; background: #101018; color: #fff; font-size: 15px; }
  input:focus { outline: 2px solid #7c3aed; border-color: transparent; }
  button { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 999px; background: linear-gradient(135deg,#7c3aed,#5b21b6); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; }
  .status { margin-top: 12px; font-size: 13px; color: #b6b6cc; min-height: 20px; }
  #screen { display: none; margin: 12px auto; width: min(100%, 1280px); background: #000; border-radius: 10px; overflow: hidden; }
  #screen canvas { width: 100%; display: block; }
  .hint { font-size: 12px; color: #77778f; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>XyDesk <span class="grad">RDP Darurat</span></h1>
  <p class="hint">Koneksi langsung dari browser lewat gateway — tanpa PC perantara. Token diberikan operator.</p>
  <div class="card">
    <label>Token</label>
    <input id="token" autocomplete="off" spellcheck="false" placeholder="tempel token dari operator">
    <label>Username RDP</label>
    <input id="user" autocomplete="username" placeholder="DOMAIN\username">
    <label>Password RDP</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button id="go">Sambungkan</button>
    <div class="status" id="status"></div>
  </div>
  <div id="screen"></div>
  <p class="hint">Kredensial hanya diproses di memori gateway selama sesi berjalan — tidak disimpan.</p>
</div>
<script type="module">
import Guacamole from "/guacamole-common.js";
(function () {
  var status = document.getElementById('status');
  var screenEl = document.getElementById('screen');
  var client = null, keyboard = null, mouse = null;

  function say(t) { status.textContent = t; }

  document.getElementById('go').addEventListener('click', async function () {
    var token = document.getElementById('token').value.trim();
    var user = document.getElementById('user').value;
    var pass = document.getElementById('pass').value;
    if (!token) { say('Token wajib diisi.'); return; }
    try {
      say('Meminta sesi…');
      var r = await fetch('/session', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ token: token, username: user, password: pass }),
      });
      var data = await r.json().catch(function () { return {}; });
      if (!r.ok) { say('Ditolak: ' + (data.error || r.status)); return; }
      if (client) { try { client.disconnect(); } catch (e) {} client = null; }
      var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      var tunnel = new Guacamole.WebSocketTunnel(proto + '//' + location.host + '/?token=' + encodeURIComponent(data.token));
      client = new Guacamole.Client(tunnel);
      screenEl.innerHTML = '';
      screenEl.appendChild(client.getDisplay().getElement());
      screenEl.style.display = 'block';
      tunnel.onstatechange = function (state) {
        if (state === Guacamole.Tunnel.State.OPEN) say('Terhubung.');
        if (state === Guacamole.Tunnel.State.CLOSED) say('Sesi ditutup.');
        if (state === Guacamole.Tunnel.State.UNSTABLE) say('Jaringan tidak stabil…');
      };
      tunnel.onerror = function (err) { say('Gagal: ' + (err && err.message ? err.message : 'koneksi ditolak')); };
      client.onerror = function (err) { say('Sesi: ' + (err && err.message ? err.message : 'galat')); };
      client.connect();
      keyboard = new Guacamole.Keyboard(document);
      keyboard.onkeydown = function (keysym) { return client.sendKeyEvent(1, keysym); };
      keyboard.onkeyup = function (keysym) { return client.sendKeyEvent(0, keysym); };
      mouse = new Guacamole.Mouse(client.getDisplay().getElement());
      mouse.onmousedown = mouse.onmouseup = function (state) { client.sendMouseState(state); };
      mouse.onmousemove = function (state) { client.sendMouseState(state); };
    } catch (e) {
      say('Gagal memulai: ' + e.message);
    }
  });
})();
</script>
</body>
</html>
