name: Publish Host UI Candidate EXE
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify pinned validated installer and fetch on CI runner
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: 4cf9f254bfcae7968a45b6e7af250c8c59ac2b0a
          RUN: '36330588678'
          ARTIFACT: '10935149643'
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .head_sha)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT" --jq .workflow_run.head_sha)" = "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT" --jq .name)" = XyDesk-Host-NSIS-x64
          mkdir installer
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name XyDesk-Host-NSIS-x64 --dir installer
          test -s installer/XyDesk-Host-Test-Setup-x64.exe
          sha256sum installer/XyDesk-Host-Test-Setup-x64.exe | tee installer/SHA256SUMS.txt
      - name: Create isolated unsigned candidate, never overwrite stable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: host-ui-candidate-4cf9f25
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Candidate release exists; refusing overwrite'
            exit 1
          fi
          gh release create "$TAG" installer/XyDesk-Host-Test-Setup-x64.exe installer/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target 4cf9f254bfcae7968a45b6e7af250c8c59ac2b0a \
            --title 'Host UI candidate 4cf9f25 (unsigned)' \
            --notes 'Unsigned Windows x64 UI candidate for visual and device acceptance. Engine source unchanged. NOT stable; do not use as releases/latest. Validate password show/edit and layout before promotion.' \
            --prerelease --latest=false
