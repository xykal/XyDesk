name: Publish Reviewed Host UI Candidate
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify pinned source and validated installer run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: 763606a689014a337805251f1bfe586de79a4e28
          RUN_ID: '36398512956'
          ARTIFACT_ID: '10959496908'
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .workflow_run.head_sha)" = "$SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .name)" = XyDesk-Host-NSIS-x64
          mkdir installer
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name XyDesk-Host-NSIS-x64 --dir installer
          test -s installer/XyDesk-Host-Test-Setup-x64.exe
          test -s installer/NSIS-VALIDATION.json
          sha256sum installer/XyDesk-Host-Test-Setup-x64.exe | tee installer/SHA256SUMS.txt
      - name: Publish unsigned prerelease, never stable/latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: host-ui-candidate-763606a
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Candidate already exists, refusing overwrite'
            exit 1
          fi
          gh release create "$TAG" installer/XyDesk-Host-Test-Setup-x64.exe installer/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target 763606a689014a337805251f1bfe586de79a4e28 \
            --title 'Host UI candidate 763606a (unsigned)' \
            --notes 'Unsigned test candidate. Web UI changes live only in the source branch, not deployed. Stable v6.8.5 is unchanged. Windows build and installer CI pass; physical PC/HP, DPI, OAuth and end-to-end streaming acceptance remain open.' \
            --prerelease --latest=false
