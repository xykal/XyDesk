name: Android Keystore

# Sekali jalan: buat keystore rilis, simpan sebagai secret repo, cetak SHA-1/256
# ke ringkasan untuk didaftarkan di Google Cloud Console (OAuth Android client).
# Keystore tidak pernah diunggah sebagai artefak.
on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Timpa keystore yang sudah ada (ya/tidak)'
        default: 'tidak'

permissions:
  contents: read

concurrency:
  group: android-keystore
  cancel-in-progress: false

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Buat dan simpan
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          EXISTS: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -eu
          if [ "$EXISTS" = "true" ] && [ "$OVERWRITE" != "ya" ]; then
            echo "Keystore sudah ada; jalankan ulang dengan overwrite=ya untuk mengganti." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pass=$(openssl rand -base64 30 | tr -d '/+=' | cut -c1-32)
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/xydesk.jks" -storetype PKCS12 \
            -alias xydesk -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$pass" -keypass "$pass" \
            -dname "CN=XyDesk, O=XyVerse Technology Global, C=ID" >/dev/null 2>&1
          gh secret set ANDROID_KEYSTORE_PASS --repo "$GITHUB_REPOSITORY" --body "$pass"
          base64 -w0 "$RUNNER_TEMP/xydesk.jks" | gh secret set ANDROID_KEYSTORE_B64 --repo "$GITHUB_REPOSITORY"
          {
            echo "## Sidik jari sertifikat rilis (daftarkan di Google Cloud Console)"
            echo '```'
            keytool -list -v -keystore "$RUNNER_TEMP/xydesk.jks" -storepass "$pass" -alias xydesk | grep -E "SHA1:|SHA256:"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/xydesk.jks"
