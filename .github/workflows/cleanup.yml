name: Bersihkan Actions

# Menjaga riwayat Actions, Artifact, dan Cache tetap ramping (< 1.5 GB):
# 1) Hanya menyimpan 2 run selesai terakhir per workflow.
# 2) Hanya menyimpan 1 artifact terbaru per nama.
# 3) Hanya menyimpan 1 cache terbaru per prefix aktif & menghapus semua cache usang/Flutter.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  workflow_run:
    workflows: ['Build', 'Android Native', 'Release']
    types: [completed]

permissions:
  actions: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hapus run lama, artifact usang, dan cache duplikat
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_RUNS: '2'
        run: |
          set -eu
          repo="$GITHUB_REPOSITORY"

          echo "=== 1. Prune Workflow Runs (keep $KEEP_RUNS per workflow) ==="
          for wf in $(gh api --paginate "repos/$repo/actions/workflows" -q '.workflows[].id'); do
            for run in $(gh api --paginate "repos/$repo/actions/workflows/$wf/runs?status=completed&per_page=100"               -q '.workflow_runs[].id' | tail -n +"$((KEEP_RUNS + 1))"); do
              gh api -X DELETE "repos/$repo/actions/runs/$run" </dev/null >/dev/null 2>&1 && echo "hapus run $run" || true
            done
          done

          echo "=== 2. Prune Artifacts (keep 1 latest per artifact name) ==="
          gh api "repos/$repo/actions/artifacts?per_page=100" | python3 -c "
          import sys, json, subprocess, os
          repo = os.environ['GITHUB_REPOSITORY']
          arts = [a for a in json.load(sys.stdin).get('artifacts', []) if not a.get('expired')]
          arts.sort(key=lambda a: a.get('id', 0), reverse=True)
          seen = set()
          for a in arts:
              nm = a.get('name', '')
              if nm in seen:
                  subprocess.run(['gh', 'api', '-X', 'DELETE', f'repos/{repo}/actions/artifacts/{a["id"]}'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  print('hapus artifact', a['id'], nm)
              else:
                  seen.add(nm)
          "

          echo "=== 3. Prune Caches (keep 1 latest per active prefix, drop legacy flutter/pub) ==="
          gh api "repos/$repo/actions/caches?per_page=100" | python3 -c "
          import sys, json, subprocess, os
          repo = os.environ['GITHUB_REPOSITORY']
          caches = json.load(sys.stdin).get('actions_caches', [])
          caches.sort(key=lambda c: c.get('id', 0), reverse=True)
          prefixes = (
              'native-Windows-x64-',
              'test-Linux-cargo-',
              'gradle-dependencies-',
              'gradle-transforms-',
              'gradle-instrumented-jars-',
              'gradle-groovy-dsl-',
              'gradle-kotlin-dsl-',
              'gradle-generated-gradle-jars-',
              'gradle-wrapper-zips-',
              'gradle-8.',
              'node-cache-',
          )
          seen = set()
          for c in caches:
              k = c.get('key', '')
              if k.startswith(('flutter-', 'pub-', 'Linux-flutter', 'Windows-flutter', 'codeql-')):
                  p = '__DROP__'
              else:
                  p = next((px for px in prefixes if k.startswith(px)), k.split('-')[0])
              if p == '__DROP__' or p in seen:
                  subprocess.run(['gh', 'api', '-X', 'DELETE', f'repos/{repo}/actions/caches/{c["id"]}'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  print('hapus cache', c['id'], k)
              else:
                  seen.add(p)
          "
