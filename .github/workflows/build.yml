name: Build

# Build multi-platform XyDesk, SEKARANG difilter per area.
#
# Sebelum 3 Sep 2026: satu job `check` raksasa + build penuh dijalankan untuk
# SEMUA push/PR, sekecil apa pun perubahannya — agent Docs yang menyentuh satu
# file markdown ikut membayar analisis Rust + 4 build. Itu lambat dan
# bikin run agent lain saling bertabrakan.
#
# Sekarang: job `changes` (murah, selalu jalan) mendeteksi area yang tersentuh
# dengan dorny/paths-filter. Job lain hanya hidup bila areanya tersentuh:
#
#   android-native/, VERSION                    → android
#   host/ atau VERSION                           → host-test (+ windows)
#   web/                                         → web
#   news/                                        → check-news
#   cloudflare/, signaling/                      → check-signaling
#   packaging/                                   → installer-lint
#   docs/, AGENT.md, CHANGELOG, workflow, dll    → check-meta
#
# Aturan penting yang dijaga:
# - `VERSION` masuk filter android DAN host: bump versi rilis (yang
#   menyentuh VERSION) tetap membangun rantai penuh client + host, sehingga
#   release.yml selalu menemukan artefak yang dibutuhkannya.
# - `workflow_dispatch` selalu = build penuh (pemulihan manual).
# - PR tetap diuji tanpa filter branch (pelajaran stacked-PR, lihat bawah) —
#   tetapi job-nya tetap hanya yang areanya berubah.
# - Job `changes` selalu berjalan dan selalu hijau, sehingga PR apa pun punya
#   status check (termasuk PR dokumen) — tidak ada lagi "PR tampil tanpa check".

on:
  # KEBIJAKAN OPERATOR (3 Sep 2026, disempurnakan): push agent TIDAK
  # memicu actions sama sekali. Semua build/kompilasi/kemasan/deploy/rilis
  # = kewenangan role CI/Release (Cakra), dijalankan manual lewat
  # `workflow_dispatch` setelah izin operator — satu run penuh saat semua
  # siap: bump → Build → Release → deploy → berita.
  #
  # Mengapa: build otomatis dari push perantara menghasilkan "hijau palsu"
  # (run terfilter, artefak tak lengkap), run yang terbuang, dan tumpang
  # tindih dengan jadwal rilis operator. Hasil akhir yang dianggap bukti
  # hanya run penuh yang disetujui.
  #
  # Kalau suatu saat area tertentu boleh memicu build parsial, tambahkan
  # path di sini — job `changes` sudah mendukung pemfiltreran per-area.
  workflow_dispatch:

# Satu-satunya pemicu kini `workflow_dispatch` (push tidak memicu actions),
# jadi run Build hanya milik operator yang memintanya. Dispatch berikutnya
# membatalkan run manual lama di ref yang sama — operator yang menekan
# tombol dua kali tetap menjalankan run terbaru saja (pelajaran 3 Sep 2026:
# run Build penuh 6.3.0 sempat dibatalkan push "board" menyusul).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  # google_sign_in serverClientId wajib memakai OAuth Web Client ID, bukan
  # Android Client ID. Android identity tetap dikenali Google lewat package
  # name dan SHA sertifikat di project OAuth.
  GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}

jobs:
  # ── 0. Deteksi area yang berubah ──
  # Selalu berjalan (semua PR/push dapat status check), selalu hijau kecuali
  # checkout gagal. Ini "saklar" untuk semua job di bawah.
  changes:
    name: Deteksi Area yang Berubah
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      host: ${{ steps.filter.outputs.host }}
      web: ${{ steps.filter.outputs.web }}
      news: ${{ steps.filter.outputs.news }}
      backend: ${{ steps.filter.outputs.backend }}
      packaging: ${{ steps.filter.outputs.packaging }}
      meta: ${{ steps.filter.outputs.meta }}
      full: ${{ steps.full.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # paths-filter butuh sejarah penuh untuk membandingkan base..head
          # pada event push (base = commit sebelum push terakhir).
          fetch-depth: 0

      - id: full
        name: Jalankan manual = build penuh
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Kunci pemetaan: area → job. Ubah di sini, plus tabel di
          # docs/CI.md, kalau struktur repo bergeser.
          filters: |
            android:
              - 'android-native/**'
              - 'VERSION'
            # `VERSION` ikut di sini: bump versi rilis menaikkan nomor
            # di host juga, jadi rantai host/client harus dibangun ulang —
            # kalau tidak, release.yml tidak menemukan artefak Windows.
            # Produk Windows = panel native C++ + engine Rust (shell
            # Tauri/Electron dihapus 2026-09-23 atas keputusan pemilik).
            host:
              - 'host/**'
              # Panel native Windows ikut area host: dialah UI yang benar-benar
              # dipasang installer, dan uji tata letaknya jalan di job host.
              - 'packaging/native-host/**'
              - 'packaging/tests/**'
              - 'tool/check_panel_shape.py'
              - 'VERSION'
            web:
              - 'web/**'
            news:
              - 'news/**'
            backend:
              - 'cloudflare/**'
              - 'signaling/**'
            packaging:
              - 'packaging/**'
            # Versi hidup di banyak manifest; perubahan apa pun di daftar
            # ini diwajibkan lolos check-meta (konsistensi versi + dokumen).
            meta:
              - 'tool/**'
              - 'docs/**'
              - 'AGENT.md'
              - 'docs/project/AGENT_BOARD.md'
              - 'docs/project/HANDOFF.md'
              - 'CHANGELOG.md'
              - 'docs/project/CONTRIBUTORS.md'
              - 'README.md'
              - 'docs/project/ROADMAP.md'
              - 'docs/project/SETUP.md'
              - '.github/workflows/**'
              - 'VERSION'
              - 'web/package.json'
              - 'host/Cargo.toml'

  # ── 1a. Gerbang worker berita ──
  check-news:
    name: Uji Worker Berita
    needs: changes
    if: needs.changes.outputs.news == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Uji gerbang badge resmi (news worker)
        run: node --test news/test/*.test.js

  # ── 1c. Gerbang mutu backend (Worker signaling + Go) ──
  check-signaling:
    name: Uji Backend (Worker + Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Worker signaling memegang JWT, OTP, dan rate limit. Sekarang
      # pengawalnya jalan di setiap perubahan cloudflare/**, bukan setelah
      # push ke main lewat deploy-signaling.yml.
      - name: Uji Worker signaling (JWT, OTP, rate limit)
        run: |
          cd cloudflare
          npm ci
          npm test

      # Signaling Go adalah jalur cadangan self-host. Formatnya pernah
      # dibiarkan menyimpang berbulan-bulan karena tidak ada yang mengecek, dan
      # aturan keamanannya (role di token, arah relay) pernah lebih lemah dari
      # Worker produksi. Uji Go kini ikut di sini: `go vet` + `go test` di
      # setiap perubahan backend.
      - name: Cek format Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: signaling/go.mod
      - name: Verifikasi gofmt
        run: |
          if [ -n "$(gofmt -l signaling/)" ]; then
            echo "::error::Berkas Go belum diformat. Jalankan: gofmt -w signaling/"
            gofmt -l signaling/
            exit 1
          fi
          echo "OK - semua berkas Go rapi."
      - name: Uji unit Go (signaling)
        run: |
          cd signaling
          go vet ./...
          go test ./...

  # ── 1d. Gerbang lintas-dokumen (versi, CI, status proyek) ──
  # Menjadi status check bagi perubahan dokumen/koordinasi: push Docs &
  # Audit, AGENT.md, CHANGELOG, atau papan koordinasi tetap punya check
  # hijau tanpa membayar build native/Rust.
  check-meta:
    name: Cek Lintas-Dokumen
    needs: changes
    if: needs.changes.outputs.meta == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nomor versi hidup di satu tempat. Kalau turunannya melenceng, footer
      # web pernah memajang v2.5.0 selama empat rilis.
      - name: Verifikasi versi konsisten di semua manifest
        run: python3 tool/check_version.py

  # ── 2. APK per ABI: unduhan kecil, tanpa universal gemuk ──
  android:
    name: APK Android per ABI (native)
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.11.1'
      - name: Siapkan keystore rilis
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/xydesk.jks"
            echo "file=$RUNNER_TEMP/xydesk.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK release per ABI
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ANDROID_KEYSTORE_FILE: ${{ steps.ks.outputs.file }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_FILE" || { echo "::error::ANDROID_KEYSTORE_B64 kosong; rilis wajib bertanda tangan"; exit 1; }
          gradle --no-daemon assembleRelease
          mkdir -p ../dist
          for abi in universal arm64-v8a armeabi-v7a; do
            f=$(ls app/build/outputs/apk/release/app-"$abi"-*.apk | head -n1)
            if [ "$abi" = universal ]; then out=XyDesk.apk; else out="XyDesk-$abi.apk"; fi
            cp "$f" "../dist/$out"
            echo "$out: $(du -h "../dist/$out" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: XyDesk-Android-APK
          path: dist/*.apk
          retention-days: 14

  host-test:
    name: Uji Logika Host (Rust)
    needs: changes
    if: needs.changes.outputs.host == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: test-${{ runner.os }}-cargo-${{ hashFiles('host/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-cargo-

      - name: Cek format
        working-directory: host
        run: cargo fmt --check

      - name: Clippy tanpa toleransi peringatan
        working-directory: host
        run: cargo clippy --all-targets -- -D warnings

      - name: Uji unit
        working-directory: host
        run: cargo test --all-targets

      # Tata letak panel digambar oleh kode yang sama dengan yang dipakai EXE
      # Windows; bagian angkanya murni C++ tanpa API Windows, jadi bisa
      # diperiksa di Linux lebih dulu sebelum runner Windows repot.
      - name: Uji tata letak panel native (tanpa Windows)
        run: packaging/tests/test-native-panel-layout.sh

  # ── 3. Produk Windows: satu aplikasi native C++ + engine Rust ──
  # UI/tray yang terlihat pengguna adalah Win32 C++ milik XyDesk. Engine
  # streaming tetap Rust sebagai child process tersembunyi agar crash UI dan
  # engine terisolasi tanpa mengorbankan WebRTC encryption, HD, atau latency.
  windows:
    name: Windows x64 (native C++ panel + Rust engine)
    needs: [changes, host-test]
    if: >-
      needs.changes.outputs.host == 'true' ||
      needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: NASM untuk OpenH264
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NASM gagal dipasang' }
            'C:\Program Files\NASM' >> $env:GITHUB_PATH
          }
      - name: Cache Cargo (engine Rust)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: native-${{ runner.os }}-x64-${{ hashFiles('host/Cargo.lock') }}
          restore-keys: native-${{ runner.os }}-x64-
      - name: Build engine Rust (release)
        working-directory: host
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin xydesk-host
      - name: Build UI native C++ Win32
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe tidak ditemukan' }
          $vcvars = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Auxiliary/Build/vcvars64.bat' | Select-Object -First 1
          if (-not $vcvars) { throw 'Toolchain MSVC x64 tidak ditemukan' }
          $out = Join-Path $PWD 'native-windows-x64'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $src = (Resolve-Path 'packaging/native-host/main.cpp').Path
          $rc = (Resolve-Path 'packaging/native-host/main.rc').Path
          $exe = Join-Path $out 'XyDesk.exe'
          $res = Join-Path $out 'xydesk.res'
          Copy-Item 'packaging/native-host/xydesk.ico' (Join-Path $out 'xydesk.ico')
          $cmd = "call `"$vcvars`" && rc.exe /nologo /fo `"$res`" `"$rc`" && cl.exe /nologo /utf-8 /std:c++20 /O2 /EHsc /MT /DUNICODE /D_UNICODE `"$src`" `"$res`" /link /SUBSYSTEM:WINDOWS /OUT:`"$exe`" user32.lib gdi32.lib shell32.lib"
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $exe)) { throw 'UI native C++ gagal dikompilasi' }
          $ctlSrc = (Resolve-Path 'packaging/windows/drivers/xydesk_vdd_ctl.cpp').Path
          $ctlExe = Join-Path $out 'xydesk-vdd-ctl.exe'
          $ctlCmd = "call `"$vcvars`" && cl.exe /nologo /utf-8 /std:c++20 /O2 /EHsc /MT /DUNICODE /D_UNICODE `"$ctlSrc`" /link /SUBSYSTEM:CONSOLE /OUT:`"$ctlExe`" setupapi.lib newdev.lib cfgmgr32.lib crypt32.lib advapi32.lib user32.lib gdi32.lib shell32.lib ole32.lib"
          cmd.exe /d /s /c $ctlCmd
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $ctlExe)) { throw 'Controller XyDesk Virtual Display Adapter gagal dikompilasi' }
      - name: Satukan aplikasi dan engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'host/target/x86_64-pc-windows-msvc/release/xydesk-host.exe' 'native-windows-x64/xydesk-host.exe' -Force
          Copy-Item 'packaging/windows/LICENSE-XyDesk-English.txt' 'native-windows-x64/LICENSE-XyDesk.txt' -Force
          Copy-Item 'packaging/windows/LICENSE-XyDesk-English.rtf' 'native-windows-x64/LICENSE-XyDesk-English.rtf' -Force
          Copy-Item 'docs/THIRD-PARTY-LICENSES.md' 'native-windows-x64/THIRD-PARTY-LICENSES.md' -Force
          if (-not (Test-Path 'native-windows-x64/LICENSE-XyDesk.txt')) { throw 'English XyDesk license tidak ditemukan' }
          Copy-Item 'packaging/windows/README-postinstall.md' 'native-windows-x64/README-postinstall.md' -Force
          Copy-Item 'packaging/windows/DEPENDENCIES-WINDOWS.txt' 'native-windows-x64/DEPENDENCIES-WINDOWS.txt' -Force
          New-Item -ItemType Directory -Force -Path 'native-windows-x64/drivers' | Out-Null
          if (Test-Path 'packaging/windows/drivers/*') {
            Copy-Item 'packaging/windows/drivers/*' 'native-windows-x64/drivers/' -Recurse -Force
          }
          if (Test-Path 'native-windows-x64/xydesk-vdd-ctl.exe') {
            New-Item -ItemType Directory -Force -Path 'native-windows-x64/drivers/IddSampleDriver' | Out-Null
            Copy-Item 'native-windows-x64/xydesk-vdd-ctl.exe' 'native-windows-x64/drivers/IddSampleDriver/xydesk-vdd-ctl.exe' -Force
          }
          if (-not (Test-Path 'native-windows-x64/XyDesk.exe')) { throw 'XyDesk.exe native tidak ada' }
          if (-not (Test-Path 'native-windows-x64/xydesk-host.exe')) { throw 'engine Rust tidak dibundel' }
          Get-ChildItem 'native-windows-x64' -Recurse | ForEach-Object { Write-Host "OUT: $($_.FullName)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: XyDesk-Windows-x64
          path: native-windows-x64/*
          retention-days: 30
          if-no-files-found: error

  web:
    name: Web Application
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pasang dependensi
        working-directory: web
        run: npm ci
      # CSP produksi (`web_deploy/static/_headers`) diperiksa terhadap origin
      # yang benar-benar dipanggil kode. Rilis 6.5.4 memindahkan domain tapi
      # melewatkan berkas ini: bundle live memanggil `signal.xydesk.my.id`
      # sementara `connect-src` masih mengizinkan `signal.xystudio.my.id` yang
      # DNS-nya sudah mati. Build hijau, deploy hijau, halaman 200 — yang
      # rusak hanya terlihat di dalam browser, jadi tidak ada langkah lain
      # yang bisa menangkapnya.
      - name: Uji CSP & sisa domain (web)
        working-directory: web
        run: npm test
      - name: Build Web Release
        working-directory: web
        env:
          # OAuth client WEB (beda dari client Android; bukan secret).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: XyDesk-Web
          path: web/dist/*
          retention-days: 30

  # ── 6. Lint installer MSI + NSIS ──
  # Kedua format harus bisa dibangun dari payload yang sama sebelum installer
  # final dijalankan. Tidak ada lagi lint Inno Setup sebagai jalur produksi.
  installer-lint:
    name: Lint MSI dan NSIS Installer
    needs: changes
    if: needs.changes.outputs.packaging == 'true' || needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pasang WiX v4 dan NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS gagal dipasang' }
          dotnet tool update --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global wix --version 4.0.6
            if ($LASTEXITCODE -ne 0) { throw 'WiX v4 gagal dipasang' }
          }
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          # `wix build -ext WixToolset.UI.wixext` mencari extension di cache
          # global; tanpa langkah ini gagal WIX0144 'extension could not be
          # found' (run 35879908181). Versi disamakan dengan tool WiX supaya
          # `-ext` tanpa versi tetap cocok.
          wix extension add -g WixToolset.UI.wixext/4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'Extension WiX UI gagal dipasang' }
      - name: Compile-check MSI dan NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fake = Join-Path $env:RUNNER_TEMP 'fake-bundle'
          New-Item -ItemType Directory -Force -Path $fake | Out-Null
          Set-Content "$fake\XyDesk.exe" 'stub'
          Set-Content "$fake\xydesk-host.exe" 'stub'
          Copy-Item 'packaging/native-host/xydesk.ico' "$fake\xydesk.ico"
          Copy-Item 'packaging/windows/LICENSE-XyDesk-English.txt' "$fake\LICENSE-XyDesk.txt"
          Copy-Item 'packaging/windows/LICENSE-XyDesk-English.rtf' "$fake\LICENSE-XyDesk-English.rtf"
          Copy-Item 'packaging/windows/DEPENDENCIES-WINDOWS.txt' "$fake\DEPENDENCIES-WINDOWS.txt"
          Set-Content "$fake\THIRD-PARTY-LICENSES.md" 'test notices'
          $wxs = Join-Path $env:RUNNER_TEMP 'XyDesk.generated.wxs'
          python packaging/windows/generate_wix.py --source-dir $fake --output $wxs --version 0.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Manifest WiX gagal dibuat' }
          # Parser WiX v4 menolak bentuk menempel `-dSourceDir=...` (WIX0118:
          # "Additional argument ... was unexpected", run 35889077917) — `-d`
          # menerima `name=value` sebagai token TERPISAH.
          wix build -arch x64 -ext WixToolset.UI.wixext -d "SourceDir=$fake" -o "$env:RUNNER_TEMP\XyDesk-lint.msi" $wxs
          if ($LASTEXITCODE -ne 0) { throw "WiX lint gagal: $LASTEXITCODE" }
          $makensisCommand = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($makensisCommand) {
            $makensisPath = $makensisCommand.Source
          } else {
            $makensisPath = Get-ChildItem 'C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS' -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $makensisPath) { throw 'makensis.exe tidak ditemukan' }
          $out = Join-Path $env:RUNNER_TEMP 'nsis-out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $makensisPath /DArch=x64 /DVersion=0.0.0 "/DSourceDir=$fake" "/DOutputDir=$out" 'packaging/nsis/XyDesk.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS lint gagal: $LASTEXITCODE" }
          if (-not (Test-Path "$out\XyDesk-x64.exe")) { throw 'Output NSIS x64 tidak ditemukan' }
          Write-Host 'OK: MSI dan NSIS lolos compile-check.'

      - name: Kompilasi panel native dan periksa bentuk jendelanya
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe tidak ditemukan' }
          $vcvars = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Auxiliary/Build/vcvars64.bat' | Select-Object -First 1
          if (-not $vcvars) { throw 'Toolchain MSVC x64 tidak ditemukan' }
          $out = Join-Path $env:RUNNER_TEMP 'panel-check'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $src = (Resolve-Path 'packaging/native-host/main.cpp').Path
          $rc = (Resolve-Path 'packaging/native-host/main.rc').Path
          $exe = Join-Path $out 'XyDesk Control Panel.exe'
          $res = Join-Path $out 'xydesk.res'
          $cmd = "call `"$vcvars`" && rc.exe /nologo /fo `"$res`" `"$rc`" && cl.exe /nologo /utf-8 /std:c++20 /O2 /EHsc /MT /DUNICODE /D_UNICODE `"$src`" `"$res`" /link /SUBSYSTEM:WINDOWS /OUT:`"$exe`" user32.lib gdi32.lib shell32.lib"
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $exe)) { throw 'Panel native gagal dikompilasi untuk pemeriksaan bentuk' }

          # Panel adalah aplikasi subsystem WINDOWS: PowerShell tidak menunggu
          # proses seperti ini dengan `&`, sehingga berkas keluaran bisa dibaca
          # sebelum sempat ditulis (run 35899915639). Start-Process -Wait
          # memaksa urutannya, dan kode keluarnya tetap diperiksa.
          function Invoke-Panel {
            param([string]$Argument, [string]$OutputPath)
            $proc = Start-Process -FilePath $exe -ArgumentList $Argument, $OutputPath -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Panel $Argument gagal (kode $($proc.ExitCode))" }
          }

          # 1) Tata letak dari EXE yang benar-benar dikompilasi — bukan dari
          #    sumber yang dibaca ulang — termasuk hasil hit-test klik.
          $probe = Join-Path $out 'panel-probe.json'
          Invoke-Panel '--panel-probe' $probe
          $layout = Get-Content $probe -Raw | ConvertFrom-Json
          Write-Host ($layout | ConvertTo-Json -Compress)
          if ($layout.windowWidth -ne 1100 -or $layout.windowHeight -ne 720) { throw "Ukuran jendela panel tidak sesuai: $($layout.windowWidth)x$($layout.windowHeight)" }
          if ($layout.panelWidth -ne 1100 -or $layout.panelHeight -ne 720) { throw 'Ukuran panel tidak sesuai' }
          # Radius 24 sejak rounded host workspace 655ef35 (27 Sep 2026); gerbang lama masih 10 dan membuat Build merah.
          if ($layout.radiusPanel -ne 24) { throw "Radius sudut panel bukan 24: $($layout.radiusPanel)" }
          if ($layout.shadowMargin -ne 0) { throw "Panel harus tanpa bayangan (margin 0): $($layout.shadowMargin)" }
          $hits = ($layout.hits -join ',')
          if ($hits -ne 'Minimize,Maximize,Close,PageStatus,PagePairing,Start,CopyId,None') { throw "Hit-test panel tidak sesuai: $hits" }

          # 2) Bentuk yang digambar aplikasi sendiri: busur sudut + tepi halus,
          #    dan sejak 25 Sep TANPA bayangan (luar panel wajib kosong).
          #    Diperiksa per piksel oleh tool/check_panel_shape.py.
          $snapshot = Join-Path $out 'panel.bmp'
          Invoke-Panel '--panel-snapshot' $snapshot
          python tool/check_panel_shape.py $snapshot --panel-width 1100 --panel-height 720 --margin 0 --radius 24 --background 255,255,255
          if ($LASTEXITCODE -ne 0) { throw 'Bentuk panel tidak sesuai' }

          # 3) Teks panel: MSVC tanpa /utf-8 pernah mengirim jendela dengan
          #    "Â·" dan tooltip "â€”". teks diperiksa langsung di dalam EXE.
          python tool/check_panel_text.py $exe
          if ($LASTEXITCODE -ne 0) { throw 'Teks panel tidak sesuai' }

  summary:
    name: Ringkasan
    needs: [changes, check-news, check-signaling, check-meta,
            host-test, android, windows, web, installer-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tulis ringkasan
        env:
          FULL: ${{ needs.changes.outputs.full }}
          ANDROID: ${{ needs.changes.outputs.android }}
          HOST: ${{ needs.changes.outputs.host }}
          WEB: ${{ needs.changes.outputs.web }}
          NEWS: ${{ needs.changes.outputs.news }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          PACKAGING: ${{ needs.changes.outputs.packaging }}
          META: ${{ needs.changes.outputs.meta }}
        run: |
          {
            echo "## Hasil Build Multi-Platform XyDesk (difilter per area)"
            echo ""
            echo "Area yang tersentuh pada run ini:"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FULL" = "true" ]; then
            echo "- build penuh (workflow_dispatch)" >> "$GITHUB_STEP_SUMMARY"
          else
            for pair in "$ANDROID:android" "$HOST:host" "$WEB:web" "$NEWS:news" \
                        "$BACKEND:backend" "$PACKAGING:packaging" "$META:meta"; do
              val="${pair%%:*}"
              name="${pair##*:}"
              if [ "$val" = "true" ]; then
                echo "- \`$name\`" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi
          {
            echo ""
            echo "| Job | Status | Artefak |"
            echo "|---|---|---|"
            echo "| Uji Worker Berita            | ${{ needs['check-news'].result }} | — |"
            echo "| Uji Backend (Worker + Go)    | ${{ needs['check-signaling'].result }} | — |"
            echo "| Cek Lintas-Dokumen           | ${{ needs['check-meta'].result }} | — |"
            echo "| Uji Logika Host (Rust)      | ${{ needs['host-test'].result }} | gerbang mutu, tanpa artefak |"
            echo "| Android APK (ARM Universal) | ${{ needs.android.result }} | \`XyDesk-Android-APK\` |"
            echo "| Windows Desktop (EXE)       | ${{ needs.windows.result }} | \`XyDesk-Windows-<arch>\` |"
            echo "| Web Application             | ${{ needs.web.result }}     | \`XyDesk-Web\`         |"
            echo "| Lint Installer Windows      | ${{ needs['installer-lint'].result }} | \`packaging/windows\` |"
            echo ""
            echo "Job dengan status \`skipped\` berarti area itu TIDAK tersentuh pada"
            echo "commit ini — itu perilaku filter CI, bukan kegagalan. Apabila branch"
            echo "protection mewajibkan status check, daftar namanya ada di kolom Job."
            echo ""
            echo "Unduh seluruh artefak dari bagian **Artifacts** di bawah halaman ini."
          } >> "$GITHUB_STEP_SUMMARY"
