name: Build XyDeskVDD driver

# Build + sign driver display virtual XyDeskVDD (IddCx UMDF2).
# Dispatch manual saja — hemat kuota Actions (kebijakan repo XyDesk).
# Signing: sertifikat self-signed. Saat sertifikat Microsoft/EV tersedia,
# ganti bagian "Buat sertifikat & tanda tangan" dengan signtool + cert EV.

on:
  workflow_dispatch:
    inputs:
      driver_version:
        description: 'DriverVer version (x.y.z.w)'
        required: false
        default: '1.0.0.0'
        type: string

permissions:
  contents: read

jobs:
  build-vdd:
    # windows-2022: WDK 22H2 + VS2022 pre-installed (sesuai dokumentasi
    # microsoft/Windows-driver-samples) — cocok dengan toolset
    # WindowsUserModeDriver10.0. Jangan pakai windows-latest/VS18: choco
    # WDK tertinggal 10.0.19041, mismatch SDK → wudfwdm.h tidak ketemu
    # (pelajaran run 38644307090).
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pasang WDK 10.0.22621 (wdksetup resmi)
        shell: powershell
        run: |
          # WDK tidak pre-installed di image runner 2026 dan winget tidak
          # tersedia di Windows Server. Pakai web-installer resmi Microsoft
          # (fwlink 2249371 = WDK 10.0.22621, VS2022-compatible).
          $url = "https://go.microsoft.com/fwlink/?linkid=2249371"
          Invoke-WebRequest -Uri $url -OutFile wdksetup.exe -UserAgent "NativeHost"
          if (-not (Test-Path wdksetup.exe) -or (Get-Item wdksetup.exe).Length -lt 500KB) {
            throw "Download wdksetup.exe gagal"
          }
          Write-Host "[XyDesk] wdksetup.exe: $((Get-Item wdksetup.exe).Length) byte"
          $p = Start-Process -FilePath ".\wdksetup.exe" -ArgumentList "/q","/l","wdk-install.log" -Wait -PassThru
          Write-Host "[XyDesk] wdksetup exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            if (Test-Path wdk-install.log) { Get-Content wdk-install.log -Tail 40 | Write-Host }
            throw "Instalasi WDK 22621 gagal (exit $($p.ExitCode))"
          }
      - name: Verifikasi WDK
        shell: powershell
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $kitVers = (Get-ChildItem "$kits\Include" -Directory | Select-Object -ExpandProperty Name) -join ", "
          Write-Host "[XyDesk] Versi kit: $kitVers"
          # WDK 22H2+ menaruh header UMDF di Include\wdf (bukan Include\<versi>)
          $wudf = Get-ChildItem -Path "$kits\Include" -Recurse -Filter wudfwdm.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wudf) { throw "wudfwdm.h tidak ditemukan di $kits\Include - WDK bermasalah" }
          Write-Host "[XyDesk] WDK OK: $($wudf.FullName)"
      - name: Cari MSBuild (vswhere)
        id: msbuild
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild tidak ditemukan" }
          "path=$msbuild" >> $env:GITHUB_OUTPUT
          Write-Host "[XyDesk] MSBuild: $msbuild"

      - name: Build XyDeskVDD.dll (msbuild, WDK, WPP)
        shell: cmd
        run: '"%MSBUILD_PATH%" packaging\windows\vdd-src\XyDeskVDD\XyDeskVDD.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:WindowsTargetPlatformVersion=10.0.22621.0 /m /v:m /nologo'
        env:
          MSBUILD_PATH: ${{ steps.msbuild.outputs.path }}

      - name: Verifikasi hasil build
        shell: powershell
        run: |
          $out = "packaging\windows\vdd-src\XyDeskVDD\x64\Release"
          $dll = Join-Path $out "XyDeskVDD.dll"
          if (-not (Test-Path $dll)) { throw "XyDeskVDD.dll tidak ditemukan di $out" }
          Write-Host "[XyDesk] Build OK: $dll ($((Get-Item $dll).Length) byte)"

      - name: Rakit paket driver + inf2cat
        shell: powershell
        run: |
          $src   = "packaging\windows\vdd-src\XyDeskVDD\x64\Release"
          $dist  = "packaging\windows\drivers\XyDeskVDD"
          $pkg   = "XyDeskVDD-package"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          # Biner driver + INF (INF source; DriverVer sudah statis)
          Copy-Item (Join-Path $src "XyDeskVDD.dll") $pkg
          Copy-Item "packaging\windows\vdd-src\XyDeskVDD\XyDeskVDD.inf" $pkg

          # Skrip dist + konfigurasi
          foreach ($f in @("install.bat","uninstall.bat","option.txt","vdd_settings.xml","README.txt")) {
            if (Test-Path (Join-Path $dist $f)) { Copy-Item (Join-Path $dist $f) $pkg }
          }

          # inf2cat → XyDeskVDD.cat (10_x64)
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $inf2cat = Get-ChildItem -Path $kits -Recurse -Filter inf2cat.exe -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $inf2cat) { throw "inf2cat.exe tidak ditemukan di $kits" }
          Write-Host "[XyDesk] inf2cat: $($inf2cat.FullName)"
          & $inf2cat.FullName /driver:(Resolve-Path $pkg) /os:10_X64
          if ($LASTEXITCODE -ne 0) { throw "inf2cat gagal" }
          if (-not (Test-Path (Join-Path $pkg "XyDeskVDD.cat"))) { throw "XyDeskVDD.cat tidak dihasilkan" }

      - name: Buat sertifikat & tanda tangan (self-signed)
        shell: powershell
        run: |
          # SERTIFIKAT SELF-SIGNED — sementara sampai sertifikat code signing
          # Microsoft/EV tersedia. Konsekuensi: peringatan SmartScreen/Defender
          # saat pertama kali memasang (diterima untuk tahap ini).
          $pkg = "XyDeskVDD-package"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=XyDeskVDD Code Signing, O=XyVerse Technology Global" `
            -KeyUsage DigitalSignature -KeyExportPolicy Exportable `
            -KeyLength 3072 -KeyAlgorithm RSA -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(5) -CertStoreLocation "Cert:\CurrentUser\My"
          if (-not $cert) { throw "Gagal membuat sertifikat self-signed" }

          # Export .cer (DER) untuk Root & TrustedPublisher
          Export-Certificate -Cert $cert -FilePath (Join-Path $pkg "XyDeskVDD.cer") | Out-Null

          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $signtool = Get-ChildItem -Path $kits -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe tidak ditemukan di $kits" }
          Write-Host "[XyDesk] signtool: $($signtool.FullName)"

          foreach ($f in @("XyDeskVDD.dll","XyDeskVDD.cat")) {
            & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint (Join-Path $pkg $f)
            if ($LASTEXITCODE -ne 0) { throw "sign $f gagal" }
          }

          # Simpan thumbprint untuk catatan build
          "THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Ringkas paket
        shell: powershell
        run: |
          Get-ChildItem XyDeskVDD-package | ForEach-Object { Write-Host "[XyDesk] $($_.Name) — $($_.Length) byte" }
          Compress-Archive -Path XyDeskVDD-package\* -DestinationPath XyDeskVDD-driver-win64.zip -Force

      - name: Upload artifact XyDeskVDD-driver-win64
        uses: actions/upload-artifact@v4
        with:
          name: XyDeskVDD-driver-win64
          path: XyDeskVDD-driver-win64.zip
          retention-days: 30
          if-no-files-found: error

      - name: Ringkasan
        shell: powershell
        run: |
          Write-Host "::notice::XyDeskVDD driver OK — sertifikat self-signed thumbprint $env:THUMBPRINT. Letakkan isi artifact ke packaging/windows/drivers/XyDeskVDD/ lalu jalankan build host untuk bundling."
