name: Prepare Windows Installer (Native C++)

# Build installer non-release dari artifact Build yang sudah lulus.
# Menghasilkan MSI WiX dan NSIS EXE dari payload yang sama.
# Tidak membuat GitHub Release dan tidak mengubah releases/latest.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build run containing XyDesk-Windows-x64
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  installer:
    name: Build MSI dan NSIS Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pastikan Build native berhasil pada commit yang sama
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          if ($env:BUILD_RUN_ID -notmatch '^\d+$') { throw 'Build run ID tidak valid' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Build run tidak dapat dibaca' }
          if ($run.conclusion -ne 'success') { throw "Build belum sukses: $($run.conclusion)" }
          if ($run.head_branch -ne 'main') { throw "Build bukan dari main: $($run.head_branch)" }
          if ($run.head_sha -ne $env:GITHUB_SHA) {
            throw "SHA Build $($run.head_sha) berbeda dari installer $env:GITHUB_SHA"
          }
          if ($run.path -ne '.github/workflows/build.yml') {
            throw "Run bukan workflow Build utama: $($run.path)"
          }

      - uses: actions/download-artifact@v4
        with:
          name: XyDesk-Windows-x64
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-bundle

      - name: Verifikasi bundle native
        shell: pwsh
        run: |
          if (-not (Test-Path 'native-bundle/XyDesk.exe')) { throw 'XyDesk.exe tidak ditemukan' }
          if (-not (Test-Path 'native-bundle/xydesk-host.exe')) { throw 'xydesk-host.exe tidak ditemukan' }
          if (-not (Test-Path 'native-bundle/LICENSE-XyDesk.txt')) { throw 'English license tidak ditemukan' }
          if (-not (Test-Path 'native-bundle/LICENSE-XyDesk-English.rtf')) { throw 'WiX English license RTF tidak ditemukan' }

      - name: Pasang WiX v4 dan NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS gagal dipasang' }
          dotnet tool update --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global wix --version 4.0.6
            if ($LASTEXITCODE -ne 0) { throw 'WiX v4 gagal dipasang' }
          }
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

      - name: Build MSI dan NSIS dari payload yang sama
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String '^version:\s*([^+\s]+)' pubspec.yaml).Matches.Groups[1].Value
          if (-not $version) { throw 'Versi tidak ditemukan di pubspec.yaml' }
          $source = (Resolve-Path native-bundle).Path
          $out = Join-Path $PWD 'installer-output'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          python packaging/windows/generate_wix.py `
            --source-dir $source `
            --output packaging/windows/XyDesk.generated.wxs `
            --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Manifest WiX gagal dibuat' }

          wix build -arch x64 -ext WixToolset.UI.wixext `
            "-dSourceDir=$source" `
            -o (Join-Path $out 'XyDesk-x64.msi') `
            packaging/windows/XyDesk.generated.wxs
          if ($LASTEXITCODE -ne 0) { throw "WiX MSI gagal: $LASTEXITCODE" }

          $makensisCommand = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($makensisCommand) {
            $makensisPath = $makensisCommand.Source
          } else {
            $makensisPath = Get-ChildItem 'C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS' `
              -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $makensisPath) { throw 'makensis.exe tidak ditemukan' }
          & $makensisPath `
            "/DArch=x64" `
            "/DVersion=$version" `
            "/DSourceDir=$source" `
            "/DOutputDir=$out" `
            'packaging/nsis/XyDesk.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS gagal: $LASTEXITCODE" }

          foreach ($expected in @('XyDesk-x64.msi', 'XyDesk-x64.exe')) {
            if (-not (Test-Path (Join-Path $out $expected))) { throw "Installer tidak ditemukan: $expected" }
          }
          $artifacts = Get-ChildItem $out -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          if ($artifacts.Count -ne 2) { throw "Jumlah installer salah: $($artifacts.Count)" }
          foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)" | Set-Content "$($artifact.FullName).sha256" -Encoding ascii
            Write-Host "$hash  $($artifact.Name)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: XyDesk-Windows-x64-Installer
          path: |
            installer-output/*.msi
            installer-output/*.exe
            installer-output/*.sha256
          if-no-files-found: error
          retention-days: 30
