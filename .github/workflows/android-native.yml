name: Android Native

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-native/**', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['android-native/**', '.github/workflows/android-native.yml']

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.11.1'
      # Keystore rilis dari secret (dibuat oleh workflow android-keystore.yml).
      # Tanpa secret: hanya debug APK (PR dari fork, dsb).
      - name: Siapkan keystore
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/xydesk.jks"
            echo "file=$RUNNER_TEMP/xydesk.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ANDROID_KEYSTORE_FILE: ${{ steps.ks.outputs.file }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/apk"
          gradle --no-daemon :xyadapt:test
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            gradle --no-daemon assembleRelease
            src=app/build/outputs/apk/release; kind="release (signed, minify)"
          else
            gradle --no-daemon assembleDebug
            src=app/build/outputs/apk/debug; kind="debug (tanpa keystore)"
          fi
          for abi in universal arm64-v8a armeabi-v7a; do
            f=$(ls "$src"/app-"$abi"-*.apk | head -n1)
            if [ "$abi" = universal ]; then out=XyDesk.apk; else out="XyDesk-$abi.apk"; fi
            cp "$f" "$RUNNER_TEMP/apk/$out"
            echo "$out ($kind): $(du -h "$RUNNER_TEMP/apk/$out" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: XyDesk-APK
          path: ${{ runner.temp }}/apk/*.apk
          retention-days: 7
      # Salin APK ke draft release terbaru supaya bisa diunduh langsung
      # (tanpa zip) setelah login. Draft tidak punya ref tag, jadi dicari
      # lewat daftar release, bukan by-tag.
      - name: Unggah ke draft release
        if: github.ref == 'refs/heads/main' && env.TOKEN != ''
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${TOKEN}"
          rel=$(curl -sf -H "$auth" "$api/releases?per_page=5" | python3 -c 'import json,sys;r=[x for x in json.load(sys.stdin) if x["draft"]];print(r[0]["id"] if r else "")')
          [ -n "$rel" ] || { echo "tidak ada draft release"; exit 0; }
          old=$(curl -sf -H "$auth" "$api/releases/$rel/assets" | python3 -c 'import json,sys;print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if a["name"] in ("XyDesk-Native.apk","XyDesk.apk","XyDesk-arm64-v8a.apk","XyDesk-armeabi-v7a.apk")))')
          for a in $old; do curl -sf -X DELETE -H "$auth" "$api/releases/assets/$a"; done
          for f in "$RUNNER_TEMP"/apk/*.apk; do
            curl -sf -H "$auth" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$rel/assets?name=$(basename "$f")" >/dev/null
          done
          echo "APK diunggah ke draft release $rel" >> "$GITHUB_STEP_SUMMARY"
