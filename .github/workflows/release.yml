name: Release

# Release stabil dibuat hanya setelah workflow Build pada main sukses.
# Perubahan versi di VERSION (contoh 1.1.0+3) menjadi tag v1.1.0.
# Jika tag/release untuk versi itu sudah ada, workflow berhenti tanpa duplikasi.
on:
  workflow_run:
    workflows: ['Build']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      draft:
        description: 'Draft: rilis dibuat tetapi tidak dipublikasikan (hanya kolaborator yang melihat; tidak ada notifikasi; klien lama tidak melihat update).'
        required: false
        type: boolean
        default: false
      release_sha:
        description: 'SHA commit yang akan dirilis (kosongkan = HEAD main saat dispatch). Wajib diisi SHA yang sudah punya Build penuh sukses — kalau diisi HEAD yang maju setelah Build, release gagal "Build sukses tidak ditemukan".'
        required: false
        type: string

permissions:
  actions: read
  contents: write

env:
  ONESIGNAL_APP_ID: 'e3d5adea-1c0f-4986-9ce5-e088d65f0998'

jobs:
  prepare:
    name: Validasi versi
    # Sejak kebijakan 3 Sep 2026 push TIDAK memicu Build — semua Build
    # dijalankan lewat `workflow_dispatch` oleh role CI/Release. Syarat lama
    # `workflow_run.event == 'push'` karena itu tidak pernah lagi terpenuhi,
    # dan Release diam-diam `skipped` walau versi sudah dinaikkan (terjadi di
    # rilis 6.5.0, Build 33781937189). Yang benar-benar penting bukan APA yang
    # memicu Build, melainkan bahwa Build-nya SUKSES di `main`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      build_run_id: ${{ steps.release.outputs.build_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - id: release
        name: Cocokkan VERSION dan Build
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          # Dispatch manual: HEAD main bisa maju setelah Build penuh selesai
          # (papan/commit sesi lain masuk). SHA eksplisit lewat input
          # menghindari rilis yang salah menunjuk SHA tanpa Build.
          release_sha="${RELEASE_SHA_INPUT:-${WORKFLOW_SHA:-$GITHUB_SHA}}"

          version_full="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version_full" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)$ ]]; then
            echo "::error::version VERSION harus berbentuk SemVer+build, contoh 1.1.0+3"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[2]}"
          tag="v$version"

          # Keberadaan tag adalah penanda bahwa nilai version ini sudah dirilis.
          # Ini tetap mengizinkan commit perbaikan setelah Build versi baru gagal.
          # Pengecualian — RILIS ULANG (pelajaran 3 Sep 2026): bila tag sudah
          # ada tetapi build number VERSION LEBIH TINGGI dari build number pada
          # update.json yang sudah terbit, rilis ulang diizinkan (aset rilis
          # ditimpa + notifikasi baru). Tanpa ini, rilis yang ditarik lalu
          # diterbitkan ulang dengan build yang sama membuat aplikasi menolak
          # pembaruan selamanya ("Build yang terpasang sudah sama atau lebih
          # baru dari Release resmi saat ini") — persis yang dialami pengguna
          # 6.3.0 build 25 hari ini.
          re_release=false
          existing_build=0
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" \
            >/dev/null 2>&1; then
            existing_url="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
                --jq '.assets[] | select(.name == "update.json") | .browser_download_url' \
                2>/dev/null || true
            )"
            if [ -n "$existing_url" ]; then
              existing_build="$(
                curl -fsSL "$existing_url" 2>/dev/null \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build", 0))' \
                  2>/dev/null || echo 0
              )"
            fi
            if [ "$existing_build" -lt "$build_number" ] 2>/dev/null; then
              echo "Tag $tag sudah ada (update.json build $existing_build) — rilis ulang ke build $build_number."
              re_release=true
            else
              echo "Tag $tag sudah ada (build $existing_build) dan build VERSION ($build_number) tidak lebih tinggi; tidak membuat Release duplikat."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          build_run_id="${WORKFLOW_RUN_ID:-}"
          if [ -z "$build_run_id" ]; then
            build_run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow build.yml \
                --commit "$release_sha" \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
          fi
          if [ -z "$build_run_id" ]; then
            echo "::error::Build sukses untuk $release_sha tidak ditemukan."
            exit 1
          fi
          # Build kini difilter per area (build.yml): run untuk commit
          # "papan/dokumen" TIDAK memuat artefak client — kalau rilis tetap
          # jalan, `gh run download` gagal BlobNotFound dan run jadi merah
          # (terjadi 3 Sep 2026). Wajib cek artefak yang dibutuhkan; kalau
          # belum ada, rilis dilewati dengan tenang dan akan jalan pada
          # Build penuh (commit bump versi / workflow_dispatch).
          artifact_names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run_id/artifacts" \
            --jq '.artifacts[].name')"
          for required in XyDesk-Android-APK XyDesk-Windows-x64; do
            if ! echo "$artifact_names" | grep -qx "$required"; then
              echo "::warning::Build run $build_run_id tidak memuat artefak $required — run itu build terfilter, bukan bump versi/penuh. Rilis dilewati; akan jalan kala Build penuh sukses."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # Pengawal SHA tertinggal (pelajaran 3 Sep 2026, rilis 6.3.0):
          # `VERSION` ikut berubah di commit fitur, Build jalan, dan
          # Release langsung menandai versi itu di SHA tersebut — padahal
          # perbaikan penting baru masuk beberapa commit setelahnya. Sekali
          # tag terlanjur menunjuk isi setengah jadi, satu-satunya jalan
          # keluar adalah menganulir rilis secara paksa.
          #
          # Karena itu: kalau `main` sudah maju melewati SHA yang mau
          # dirilis, JANGAN diam-diam merilis yang lama. Untuk dispatch
          # manual dengan `release_sha` eksplisit, operator dianggap tahu
          # apa yang dimintanya — cukup peringatan. Selain itu, berhenti.
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ -n "$head_sha" ] && [ "$head_sha" != "$release_sha" ]; then
            behind="$(gh api \
              "repos/$GITHUB_REPOSITORY/compare/$release_sha...$head_sha" \
              --jq '.ahead_by // 0')"
            if [ -n "$RELEASE_SHA_INPUT" ]; then
              echo "::warning::release_sha $release_sha tertinggal $behind commit dari main ($head_sha). Diteruskan karena SHA diminta operator secara eksplisit."
            else
              echo "::error::Menolak merilis $release_sha — main sudah maju $behind commit ($head_sha). Tag akan menunjuk isi yang belum lengkap. Jalankan Build penuh di HEAD main, atau dispatch Release dengan release_sha yang disengaja."
              exit 1
            fi
          fi

          conclusion="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run_id" \
              --jq '.conclusion'
          )"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Build run $build_run_id belum sukses ($conclusion)."
            exit 1
          fi

          {
            echo "should_release=true"
            echo "version=$version"
            echo "build_number=$build_number"
            echo "tag=$tag"
            echo "release_sha=$release_sha"
            echo "build_run_id=$build_run_id"
            echo "re_release=$re_release"
          } >> "$GITHUB_OUTPUT"
          echo "Siap merilis $tag (build $build_number) dari $release_sha."

  clients:
    name: Ambil build client yang sudah lulus
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Unduh artefak Build terverifikasi
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ needs.prepare.outputs.build_run_id }}
        run: |
          set -euo pipefail
          mkdir -p incoming/android incoming/windows-x64 dist
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name XyDesk-Android-APK --dir incoming/android
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name XyDesk-Windows-x64 --dir incoming/windows-x64
          cp incoming/android/XyDesk-arm64-v8a.apk dist/
          cp incoming/android/XyDesk-armeabi-v7a.apk dist/
          # Satu paket Windows native C++ + engine Rust sebagai bahan installer.
          (cd incoming/windows-x64 && zip -q -r ../../dist/app-windows-x64.zip .)
          test -s dist/XyDesk-arm64-v8a.apk
          test -s dist/XyDesk-armeabi-v7a.apk
          test -s dist/app-windows-x64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-client-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  windows-installer:
    name: Installer Windows ${{ matrix.arch }}
    needs: [prepare, clients]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-client-assets
          path: incoming/clients
      - name: Satukan aplikasi dan engine Host
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "xydesk-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          # Artefak Windows: satu UI native C++ (XyDesk.exe) + engine Rust
          # (xydesk-host.exe) dalam bundle yang sama.
          Expand-Archive "incoming/clients/app-windows-${{ matrix.arch }}.zip" $bundle
          if (-not (Test-Path "$bundle/XyDesk.exe")) { throw "XyDesk.exe tidak ada di bundle" }
          if (-not (Test-Path "$bundle/xydesk-host.exe")) {
            throw "engine tidak dibundel (xydesk-host.exe hilang)"
          }
          "BUNDLE_PATH=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Bundle driver VDD untuk installer (opt-in)
        shell: pwsh
        run: |
          $bundle = $env:BUNDLE_PATH
          if (-not $bundle -or -not (Test-Path $bundle)) {
            Write-Host "[SKIP] BUNDLE_PATH tidak set; skip driver VDD."
            exit 0
          }
          $driverRoot = Join-Path $bundle "drivers"
          $driverIDD = Join-Path $driverRoot "IddSampleDriver"
          New-Item -ItemType Directory -Force -Path $driverIDD | Out-Null

          # INF upstream hanya mendeklarasikan [Standard.NTamd64] — driver ini
          # tidak berlaku di Windows on Arm. Jangan paketkan di installer arm64.
          if ("${{ matrix.arch }}" -ne "x64") {
            Write-Host "[SKIP] VDD hanya untuk x64; arch=${{ matrix.arch }}."
            exit 0
          }

          # 1. Unduh MttVDD (VirtualDrivers/Virtual-Display-Driver 24.10.27 HDR IddCx)
          $mttZip = "$env:RUNNER_TEMP\mttvdd.zip"
          $mttUrl = "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/24.10.27/VirtualDisplayDriver-x64.zip"
          try {
            Invoke-WebRequest -Uri $mttUrl -OutFile $mttZip -UseBasicParsing -ErrorAction Stop
            $mttStage = Join-Path $env:RUNNER_TEMP "mtt-stage"
            Remove-Item $mttStage -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive $mttZip -DestinationPath $mttStage -Force
            $mttInner = Join-Path $mttStage "VirtualDisplayDriver"
            if (Test-Path $mttInner) {
              Copy-Item "$mttInner\*" $driverIDD -Recurse -Force
            } else {
              Copy-Item "$mttStage\*" $driverIDD -Recurse -Force
            }
            Write-Host "[OK] Driver MttVDD 24.10.27 HDR berhasil disertakan."
          } catch {
            Write-Host "[WARN] Gagal unduh MttVDD ($mttUrl): $($_.Exception.Message)"
          }

          # 2. Unduh ge9/IddSampleDriver 0.0.1.4 (fallback universal Win10 1607+)
          $hasDriver = $false
          $iddZip = "$env:RUNNER_TEMP\idd.zip"
          $urls = @(
            "https://github.com/ge9/IddSampleDriver/releases/download/0.0.1.4/IddSampleDriver.zip",
            "https://github.com/ge9/IddSampleDriver/releases/download/0.0.1.3/IddSampleDriver.zip"
          )
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile $iddZip -UseBasicParsing -ErrorAction Stop
              # Zip berisi folder bersarang IddSampleDriver/ dengan berkas
              # huruf kecil. Ekstrak ke induk lalu ratakan.
              $stage = Join-Path $env:RUNNER_TEMP "idd-stage"
              Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive $iddZip -DestinationPath $stage -Force
              $inner = Join-Path $stage "IddSampleDriver"
              if (Test-Path $inner) {
                Copy-Item "$inner\*" $driverIDD -Recurse -Force
              } else {
                Copy-Item "$stage\*" $driverIDD -Recurse -Force
              }
              $hasDriver = $true; break
            } catch {
              Write-Host "[WARN] Gagal unduh $u : $($_.Exception.Message)"
            }
          }
          # Unduhan gagal = bug (URL/tag salah), bukan kondisi normal.
          if (-not $hasDriver -and -not (Test-Path (Join-Path $driverIDD "MttVDD.inf"))) {
            Write-Host "::error::Driver VDD gagal diunduh dari semua URL."
            exit 1
          }
          # Buktikan berkas yang dicari install.bat memang ada.
          foreach ($need in @("iddsampledriver.inf", "iddsampledriver.cer")) {
            if (-not (Test-Path (Join-Path $driverIDD $need))) {
              Write-Host "::error::Berkas driver $need tidak ditemukan setelah ekstraksi."
              Get-ChildItem $driverIDD | ForEach-Object { Write-Host "  ada: $($_.Name)" }
              exit 1
            }
          }
          Write-Host "[OK] Driver VDD siap (x64)."


          $copy = @(
            @{ src = "packaging/windows/drivers/IddSampleDriver/install.bat";      dst = "IddSampleDriver/install.bat" },
            @{ src = "packaging/windows/drivers/IddSampleDriver/uninstall.bat";    dst = "IddSampleDriver/uninstall.bat" },
            @{ src = "packaging/windows/drivers/IddSampleDriver/option.txt";       dst = "IddSampleDriver/option.txt" },
            @{ src = "packaging/windows/drivers/IddSampleDriver/vdd_settings.xml"; dst = "IddSampleDriver/vdd_settings.xml" },
            @{ src = "packaging/windows/drivers/install-all-drivers.bat";          dst = "install-all-drivers.bat" },
            @{ src = "packaging/windows/drivers/license-ge9.txt";                  dst = "license-ge9.txt" },
            @{ src = "packaging/windows/drivers/README-VDD.txt";                  dst = "README-VDD.txt" }
          )
          foreach ($s in $copy) {
            if (Test-Path $s.src) {
              Copy-Item $s.src (Join-Path $driverRoot $s.dst) -Force
            }
          }
          if (Test-Path (Join-Path $bundle "xydesk-vdd-ctl.exe")) {
            Copy-Item (Join-Path $bundle "xydesk-vdd-ctl.exe") (Join-Path $driverIDD "xydesk-vdd-ctl.exe") -Force
          }

          # Bundle Driver Virtual Audio & Mic (VB-CABLE)
          $driverAudio = Join-Path $driverRoot "audio"
          New-Item -ItemType Directory -Force -Path $driverAudio | Out-Null
          $cableZip = "$env:RUNNER_TEMP\vbcable.zip"
          $cableUrl = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip"
          # Rantai pasok: zip vendor dipaku ke SHA-256 (Driver Pack 45, 2024-09-30).
          # Hash berbeda = berhenti, jangan pernah mengemas driver yang tidak dikenal.
          $cableSha256 = "b950e39f01af1d04ea623c8f6d8eb9b6ea5c477c637295fabf20631c85116bfb"
          try {
            Invoke-WebRequest -Uri $cableUrl -OutFile $cableZip -UseBasicParsing -ErrorAction Stop
          } catch {
            Write-Host "[WARN] Gagal unduh VB-CABLE: $($_.Exception.Message)"
            $cableZip = $null
          }
          if ($cableZip) {
            $actual = (Get-FileHash $cableZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $cableSha256) { throw "VB-CABLE SHA-256 tidak cocok: $actual (diharapkan $cableSha256)" }
            Expand-Archive $cableZip -DestinationPath $driverAudio -Force
            Write-Host "[OK] Driver Virtual Audio (VB-CABLE) diunduh, hash cocok, diekstrak."
          }

          $audioCopy = @(
            @{ src = "packaging/windows/drivers/audio/install-audio.bat";   dst = "audio/install-audio.bat" },
            @{ src = "packaging/windows/drivers/audio/uninstall-audio.bat"; dst = "audio/uninstall-audio.bat" },
            @{ src = "packaging/windows/drivers/audio/README-AUDIO.txt";    dst = "audio/README-AUDIO.txt" },
            @{ src = "packaging/windows/drivers/audio/license-vbcable.txt"; dst = "audio/license-vbcable.txt" }
          )
          foreach ($s in $audioCopy) {
            if (Test-Path $s.src) {
              Copy-Item $s.src (Join-Path $driverRoot $s.dst) -Force
            }
          }
          Write-Host "[OK] Bundle driver lengkap (VDD + Audio/Mic) siap."
      - name: Siapkan license English dan dependency manifest
        shell: pwsh
        run: |
          Copy-Item 'packaging/windows/LICENSE-XyDesk-English.txt' "$env:BUNDLE_PATH/LICENSE-XyDesk.txt" -Force
          Copy-Item 'packaging/windows/LICENSE-XyDesk-English.rtf' "$env:BUNDLE_PATH/LICENSE-XyDesk-English.rtf" -Force
          Copy-Item 'packaging/windows/DEPENDENCIES-WINDOWS.txt' "$env:BUNDLE_PATH/DEPENDENCIES-WINDOWS.txt" -Force
          if (-not (Test-Path "$env:BUNDLE_PATH/LICENSE-XyDesk.txt")) { throw 'English license tidak ada' }
          if (-not (Test-Path "$env:BUNDLE_PATH/LICENSE-XyDesk-English.rtf")) { throw 'WiX English license RTF tidak ada' }

      - name: Pasang WiX v4 dan NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS gagal dipasang' }
          dotnet tool update --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global wix --version 4.0.6
            if ($LASTEXITCODE -ne 0) { throw 'WiX v4 gagal dipasang' }
          }
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          # `wix build -ext WixToolset.UI.wixext` mencari extension di cache
          # global; tanpa langkah ini gagal WIX0144 'extension could not be
          # found' (run 35879908181). Versi disamakan dengan tool WiX supaya
          # `-ext` tanpa versi tetap cocok.
          wix extension add -g WixToolset.UI.wixext/4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'Extension WiX UI gagal dipasang' }

      - name: Build MSI dan NSIS EXE
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP "installer-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          python packaging/windows/generate_wix.py `
            --source-dir $env:BUNDLE_PATH `
            --output "$env:RUNNER_TEMP\XyDesk.generated.wxs" `
            --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Manifest WiX gagal dibuat' }
          wix build -arch x64 -ext WixToolset.UI.wixext `
            -d "SourceDir=$env:BUNDLE_PATH" `
            -o "$out\XyDesk-${{ matrix.arch }}.msi" `
            "$env:RUNNER_TEMP\XyDesk.generated.wxs"
          if ($LASTEXITCODE -ne 0) { throw "WiX MSI gagal: $LASTEXITCODE" }
          $makensisCommand = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($makensisCommand) {
            $makensisPath = $makensisCommand.Source
          } else {
            $makensisPath = Get-ChildItem 'C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS' -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $makensisPath) { throw 'makensis.exe tidak ditemukan' }
          & $makensisPath `
            "/DArch=${{ matrix.arch }}" `
            "/DVersion=$env:VERSION" `
            "/DSourceDir=$env:BUNDLE_PATH" `
            "/DOutputDir=$out" `
            'packaging/nsis/XyDesk.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS gagal: $LASTEXITCODE" }
          foreach ($expected in @("XyDesk-${{ matrix.arch }}.msi", "XyDesk-${{ matrix.arch }}.exe")) {
            if (-not (Test-Path (Join-Path $out $expected))) { throw "Installer tidak ditemukan: $expected" }
          }
          Get-ChildItem $out -File | Where-Object { $_.Extension -in '.msi', '.exe' } | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
          "INSTALLER_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-installer-${{ matrix.arch }}
          path: |
            ${{ env.INSTALLER_OUT }}/*.msi
            ${{ env.INSTALLER_OUT }}/*.exe
            ${{ env.INSTALLER_OUT }}/*.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Terbitkan Release dan push update
    needs: [prepare, clients, windows-installer]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Validasi secret push sebelum publikasi
        run: |
          if [ -z "$ONESIGNAL_REST_API_KEY" ]; then
            echo "::error::GitHub Secret ONESIGNAL_REST_API_KEY belum diatur. Release tidak dipublikasikan."
            exit 1
          fi

      - name: Kumpulkan aset, banner, checksum, dan manifest
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/release-client-assets/XyDesk-arm64-v8a.apk dist/
          cp artifacts/release-client-assets/XyDesk-armeabi-v7a.apk dist/
          # Changelog rilis ikut dilampirkan — wajib ada di setiap rilis.
          cp CHANGELOG.md dist/CHANGELOG.md
          # Dua installer x64 dari payload yang sama: EXE NSIS untuk pengguna
          # umum dan MSI WiX untuk deployment Windows/enterprise. Keduanya
          # diterbitkan langsung; ZIP hanya dipakai sebagai artifact internal.
          cp artifacts/release-installer-x64/XyDesk-x64.exe dist/
          cp artifacts/release-installer-x64/XyDesk-x64.msi dist/
          # Banner dirender ulang setiap rilis: versi, build, dan tanggal
          # ditulis otomatis di atas art dasar HD (tool/art/banner.py).
          pip install --quiet Pillow
          python3 tool/art/banner.py \
            --version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --out dist/xydesk_update_banner_1024x512.jpg
          test -s dist/XyDesk-arm64-v8a.apk
          test -s dist/XyDesk-armeabi-v7a.apk
          cd dist
          sha256sum XyDesk-arm64-v8a.apk \
            XyDesk-armeabi-v7a.apk \
            XyDesk-x64.exe \
            XyDesk-x64.msi \
            xydesk_update_banner_1024x512.jpg \
            > SHA256SUMS.txt
          arm64_sha="$(sha256sum XyDesk-arm64-v8a.apk | cut -d' ' -f1)"
          arm64_bytes="$(stat -c%s XyDesk-arm64-v8a.apk)"
          armv7_sha="$(sha256sum XyDesk-armeabi-v7a.apk | cut -d' ' -f1)"
          armv7_bytes="$(stat -c%s XyDesk-armeabi-v7a.apk)"
          winx64_sha="$(sha256sum XyDesk-x64.exe | cut -d' ' -f1)"
          winx64_bytes="$(stat -c%s XyDesk-x64.exe)"
          winx64_msi_sha="$(sha256sum XyDesk-x64.msi | cut -d' ' -f1)"
          winx64_msi_bytes="$(stat -c%s XyDesk-x64.msi)"
          export arm64_sha arm64_bytes armv7_sha armv7_bytes
          export winx64_sha winx64_bytes winx64_msi_sha winx64_msi_bytes
          python3 - <<'PY'
          import json, os
          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          version = os.environ['VERSION']
          build = int(os.environ['BUILD_NUMBER'])
          base = f"https://github.com/{repository}/releases/download/{tag}"
          manifest = {
              "schema": 2,
              "version": version,
              "build": build,
              "tag": tag,
              "title": "XyDesk Update!! Cek Sekarang",
              "summary": (
                  f"XyDesk {version} sudah tersedia dengan peningkatan "
                  "pengalaman, stabilitas, dan keamanan pembaruan."
              ),
              "notes": [
                  "Penyempurnaan pengalaman XyDesk dan tampilan Session.",
                  "Pembaruan resmi terverifikasi dengan checksum SHA-256.",
                  "Detail lengkap tersedia di catatan GitHub Release resmi."
              ],
              "apks": {
                  "arm64-v8a": {
                      "url": f"{base}/XyDesk-arm64-v8a.apk",
                      "sha256": os.environ["arm64_sha"],
                      "bytes": int(os.environ["arm64_bytes"]),
                  },
                  "armeabi-v7a": {
                      "url": f"{base}/XyDesk-armeabi-v7a.apk",
                      "sha256": os.environ["armv7_sha"],
                      "bytes": int(os.environ["armv7_bytes"]),
                  },
              },
              # Installer Windows dari payload native C++ + engine Rust.
              # Field legacy url/sha256/bytes tetap menunjuk ke EXE NSIS agar
              # client lama kompatibel; metadata MSI ditambahkan sebagai field
              # paralel untuk deployment enterprise.
              "windows": {
                  "x64": {
                      "url": f"{base}/XyDesk-x64.exe",
                      "sha256": os.environ["winx64_sha"],
                      "bytes": int(os.environ["winx64_bytes"]),
                      "msi_url": f"{base}/XyDesk-x64.msi",
                      "msi_sha256": os.environ["winx64_msi_sha"],
                      "msi_bytes": int(os.environ["winx64_msi_bytes"]),
                  },
              },
              "release_url": f"https://github.com/{repository}/releases/tag/{tag}",
              "banner_url": f"{base}/xydesk_update_banner_1024x512.jpg",
          }
          with open("update.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, separators=(",", ":"))
              handle.write("\n")
          PY
          python3 -m json.tool update.json >/dev/null
          sha256sum update.json >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Hapus aset rilis lama (mode rilis ulang)
        if: needs.prepare.outputs.re_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in \
            CHANGELOG.md SHA256SUMS.txt update.json \
            XyDesk-arm64-v8a.apk XyDesk-armeabi-v7a.apk \
            XyDesk-x64.exe XyDesk-x64.msi \
            xydesk_update_banner_1024x512.jpg
          do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes 2>/dev/null || true
          done

      - name: Siapkan isi changelog untuk Release
        run: |
          {
            echo 'CHANGELOG_BODY<<EOF'
            sed -n '/^## \[/,$p' CHANGELOG.md | head -n 120
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Publikasikan GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # `GITHUB_TOKEN` bawaan ditolak 403 "Resource not accessible by
          # integration" saat membuat Release, walau job sudah punya
          # `contents: write` dan izin default repo sudah dinaikkan ke write
          # (rilis 6.5.0: tiga run gagal berturut-turut di langkah ini).
          # Membuat Release + tag dengan PAT pemilik repo terbukti berhasil,
          # jadi dipakai `RELEASE_TOKEN` bila tersedia dan jatuh kembali ke
          # `GITHUB_TOKEN` supaya fork/uji tanpa secret tidak langsung patah.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.release_sha }}
          files: dist/*
          fail_on_unmatched_files: true
          # Rilis ulang: aset lama dihapus oleh langkah 'Hapus aset rilis
          # lama' sebelum publish — action-gh-release v2 TIDAK punya input
          # 'update_release' (memicu warning "Unexpected input"), cukup
          # ditimpa lewat penghapusan + upload ulang.
          generate_release_notes: true
          # Draft juga bisa dipaksa lewat repo variable RELEASE_DRAFT=true
          # (berlaku untuk rilis otomatis pasca-Build, bukan hanya dispatch).
          draft: ${{ inputs.draft == true || vars.RELEASE_DRAFT == 'true' }}
          body: |
            ## XyDesk ${{ needs.prepare.outputs.tag }}

            Rilis resmi XyDesk untuk Android, Windows, dan Web.

            ${{ env.CHANGELOG_BODY }}

            | Platform | Berkas | Keterangan |
            |---|---|---|
            | Windows x64 EXE | `XyDesk-x64.exe` | Installer NSIS direct download |
            | Windows x64 MSI | `XyDesk-x64.msi` | Deployment Windows/enterprise |
            | Android 64-bit | `XyDesk-arm64-v8a.apk` | HP Android modern |
            | Android 32-bit | `XyDesk-armeabi-v7a.apk` | Perangkat ARMv7 lama |

            Installer Windows sudah memuat aplikasi dan engine Host sekaligus —
            tidak ada berkas terpisah yang perlu diunduh. Client web tersedia
            online di https://app.xydesk.my.id

            XyDesk memverifikasi APK menggunakan metadata `update.json`,
            checksum SHA-256, package ID, dan sertifikat signing sebelum installer dibuka.

            > APK ditandatangani dengan keystore rilis. Windows EXE belum
            > code-signed sehingga SmartScreen dapat menampilkan peringatan.

      - name: Kirim OneSignal hanya ke build Android lama
        if: ${{ inputs.draft != true && vars.RELEASE_DRAFT != 'true' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, uuid
          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          version = os.environ['VERSION']
          build = os.environ['BUILD_NUMBER']
          base = f"https://github.com/{repository}/releases/download/{tag}"
          payload = {
              "app_id": os.environ["ONESIGNAL_APP_ID"],
              "target_channel": "push",
              "isAndroid": True,
              # Saat rilis baru terbit, semua subscriber masih berada pada
              # build lama. Segment resmi lebih andal daripada membandingkan
              # app_version string dengan Android versionCode integer.
              "included_segments": ["Subscribed Users"],
              "headings": {
                  "en": "XyDesk Update!! Cek Sekarang",
                  "id": "XyDesk Update!! Cek Sekarang",
              },
              "contents": {
                  "en": f"Versi {version} sudah tersedia. Lihat detail pembaruan di XyDesk.",
                  "id": f"Versi {version} sudah tersedia. Lihat detail pembaruan di XyDesk.",
              },
              "data": {
                  "route": "app_update",
                  "version": version,
                  "build": build,
                  "title": "XyDesk Update!! Cek Sekarang",
                  "summary": f"Versi {version} sudah tersedia untuk diunduh dan dipasang.",
                  "notes": [
                      "Penyempurnaan pengalaman dan stabilitas XyDesk.",
                      "APK resmi diverifikasi sebelum pemasangan."
                  ],
              },
              "big_picture": f"{base}/xydesk_update_banner_1024x512.jpg",
              "name": f"XyDesk release {tag}",
              # Sertakan build number: rilis ulang dengan tag yang sama (mis.
              # build 25 → 26) HARUS tetap mengirim notifikasi — tanpa build
              # di key, OneSignal menolak duplikat dan pengguna build lama
              # tidak pernah tahu ada pembaruan.
              "idempotency_key": str(uuid.UUID(
                  bytes=uuid.uuid5(uuid.NAMESPACE_URL, f"xydesk:{tag}:{build}").bytes,
                  version=4,
              )),
          }
          with open('/tmp/onesignal-payload.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, ensure_ascii=False)
          PY
          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --url 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Key $ONESIGNAL_REST_API_KEY" \
              --data-binary @/tmp/onesignal-payload.json
          )"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::OneSignal menolak push update (HTTP $status)."
            python3 - <<'PY' "$response_file"
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding='utf-8'))
              print(json.dumps({k: data[k] for k in ('errors', 'warnings') if k in data}))
          except Exception:
              print('Respons OneSignal tidak dapat dibaca.')
          PY
            exit 1
          fi
          # OneSignal menjawab 200 dengan id kosong bila segmen tujuan kosong.
          # Ini pernah membuat tiga rilis berturut-turut terbit tanpa satu pun
          # notifikasi: perangkat sudah memberi izin di Android, tapi belum
          # opt-in di SDK sehingga tidak masuk segmen "Subscribed Users".
          # Aplikasi 6.2.2 sudah opt-in otomatis; percobaan kedua di bawah
          # menyelamatkan pemasangan lama yang belum diperbarui.
          if python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if not d.get('id') else 1)" "$response_file"; then
            echo "::warning::Segmen Subscribed Users kosong. Mencoba ulang ke seluruh langganan."
            python3 - <<'PY'
          import json
          payload = json.load(open('/tmp/onesignal-payload.json', encoding='utf-8'))
          payload['included_segments'] = ['Total Subscriptions']
          payload.pop('idempotency_key', None)
          json.dump(payload, open('/tmp/onesignal-retry.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY
            retry_file="$(mktemp)"
            curl --silent --show-error \
              --output "$retry_file" \
              --request POST \
              --url 'https://api.onesignal.com/notifications' \
              --header 'Content-Type: application/json' \
              --header "Authorization: Key $ONESIGNAL_REST_API_KEY" \
              --data-binary @/tmp/onesignal-retry.json
            response_file="$retry_file"
          fi
          python3 - <<'PY' "$response_file"
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if not data.get('id'):
              print('::warning::Push tidak terkirim: tidak ada perangkat yang '
                    'bisa dihubungi. '
                    f"Respons: {json.dumps(data, ensure_ascii=False)}")
          else:
              print(f"Push OneSignal dibuat: id={data.get('id')} "
                    f"recipients={data.get('recipients')}")
          PY
