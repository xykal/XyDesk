name: Host Check

# Iterasi cepat untuk perubahan host Windows: format + clippy di Linux dan
# `cargo check` di Windows, tanpa build release/NASM/panel C++ (yang itu
# tetap tugas build.yml). Dipicu manual saja agar kuota Actions tetap hemat.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format + Clippy (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: test-${{ runner.os }}-cargo-${{ hashFiles('host/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-cargo-
      - name: Cek format
        working-directory: host
        run: cargo fmt --check
      - name: Clippy tanpa toleransi peringatan
        working-directory: host
        run: cargo clippy --all-targets -- -D warnings

  windows-check:
    name: cargo check (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: NASM untuk OpenH264
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NASM gagal dipasang' }
            'C:\Program Files\NASM' >> $env:GITHUB_PATH
          }
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: check-${{ runner.os }}-x64-${{ hashFiles('host/Cargo.lock') }}
          restore-keys: |
            check-${{ runner.os }}-x64-
            native-${{ runner.os }}-x64-
      - name: Clippy target Windows
        working-directory: host
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --bin xydesk-host -- -D warnings
